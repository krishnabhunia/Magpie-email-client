protocols = imap
listen = 127.0.0.1
base_dir = /opt/imaptest/run
state_dir = /opt/imaptest/state
log_path = /opt/imaptest/dovecot.log
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/opt/imaptest/mail/%u
mail_uid = mailtest
mail_gid = mailtest
first_valid_uid = 1
default_login_user = mailtest
default_internal_user = mailtest
default_internal_group = mailtest
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /opt/imaptest/users
}
userdb {
  driver = static
  args = uid=mailtest gid=mailtest home=/opt/imaptest/mail/%u
}
protocol imap {
  mail_max_userip_connections = 50
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
