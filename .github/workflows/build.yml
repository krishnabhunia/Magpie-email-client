name: Build Magpie

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# One release job at a time, so a push to main and a tag push can't race to create the same release.
concurrency:
  group: magpie-build-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      # Optional Authenticode signing – skipped while these secrets are empty.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Design E1 (same as evict-uninstaller): a PR that sets a new <Version> in Directory.Build.props is the release.
      # While it is open, its CI publishes a test version <version>-beta.<run number> (pre-release, tried through
      # Settings → Updates → "Include test versions"); merging it publishes <version> to everyone.
      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IS_OWN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $num = python build/release_prep.py numeric $v
          if ($LASTEXITCODE -ne 0) { throw "Version '$v' in Directory.Build.props isn't x.y.z" }
          # Released already *with* its files? (A release whose upload failed gets its files on the next push.)
          $assets = gh release view "v$v" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>$null
          $released = ($LASTEXITCODE -eq 0) -and ($assets -contains 'Magpie.exe') -and ($assets -contains 'Magpie.exe.sha256')
          $global:LASTEXITCODE = 0
          $beta = ($env:IS_OWN_PR -eq "true") -and -not $released
          if ($beta) { "version=$v-beta.${{ github.run_number }}" >> $env:GITHUB_OUTPUT } else { "version=$v" >> $env:GITHUB_OUTPUT }
          "base=$v" >> $env:GITHUB_OUTPUT
          "numeric=$num" >> $env:GITHUB_OUTPUT
          "released=$($released.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "beta=$($beta.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v · released: $released · test version: $beta"

      - name: Release script tests
        run: python build/test_release_prep.py

      # A new version must be ready to go out: CHANGELOG section dated, installer version matching.
      - name: New version is ready to release
        if: steps.ver.outputs.released != 'true'
        run: python build/release_prep.py check ${{ steps.ver.outputs.base }}

      - name: Restore
        run: dotnet restore Magpie.sln

      - name: Unit tests (integration tests need a local IMAP server and are skipped here)
        run: dotnet test tests/Magpie.Core.Tests/Magpie.Core.Tests.csproj -c Release --no-restore --filter "Category!=Integration"

      - name: Build app
        run: dotnet build src/Magpie.App/Magpie.App.csproj -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: XAML static checks (blocking)
        env:
          PYTHONUTF8: "1"
        shell: pwsh
        run: |
          dotnet run --project build/DpDump -c Release -- build/app-types.json src/Magpie.App/bin/Release/net8.0-windows10.0.19041.0/win-x64/Magpie.dll
          python build/xaml_check.py --dps build/app-types.json
          if ($LASTEXITCODE -ne 0) { throw "XAML check failed" }

      - name: Every referenced assembly is in the build (blocking)
        shell: pwsh
        run: |
          dotnet run --project build/DpDump -c Release -- --check-refs src/Magpie.App/bin/Release/net8.0-windows10.0.19041.0/win-x64
          if ($LASTEXITCODE -ne 0) { throw "A referenced assembly is missing from the build: the app would crash on Windows" }

      - name: Publish single-file EXE
        run: dotnet publish src/Magpie.App/Magpie.App.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Sign Magpie.exe (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish\Magpie.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppNumericVersion=${{ steps.ver.outputs.numeric }}" "/DSourceDir=$PWD\publish" installer\Magpie.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash publish/Magpie.exe -Algorithm SHA256).Hash | Out-File publish/Magpie.exe.sha256 -Encoding ascii
          Get-ChildItem installer\Output\*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256" -Encoding ascii }

      # Design Z1: Magpie-<version>.zip holds exactly two folders — installer\ (setup EXE) and portable\
      # (Magpie.exe + portable.txt, so its data stays in MagpieData next to it). The script refuses anything else.
      - name: Release zip (installer + portable)
        run: python build/release_prep.py zip ${{ steps.ver.outputs.version }} --setup installer/Output --exe publish --out release

      # The CI download follows the same rule as the release zip: only installer\ and portable\ inside.
      - name: Unpack the zip for the CI download
        shell: pwsh
        run: |
          Expand-Archive release/Magpie-${{ steps.ver.outputs.version }}.zip -DestinationPath ci-download
          python build/release_prep.py check-folders ci-download

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Magpie-${{ steps.ver.outputs.version }}-${{ github.sha }}
          path: ci-download/
          if-no-files-found: error

      # Automatic releases: a push to main whose version (Directory.Build.props) has no release yet
      # publishes one — tag v<version>, EXE, installer, the installer + portable zip and checksums, notes from CHANGELOG.md.
      # Magpie's built-in updater reads the newest release, so "push a new version" = "ship it".
      - name: Is this version released yet?
        id: rel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          if ("${{ steps.ver.outputs.released }}" -eq "true") {
            "needed=false" >> $env:GITHUB_OUTPUT; Write-Host "v${{ steps.ver.outputs.version }} already released"
          } else {
            "needed=true" >> $env:GITHUB_OUTPUT; Write-Host "v${{ steps.ver.outputs.version }} will be released (or its files completed)"
          }
          # Release notes = this version's section of CHANGELOG.md (written as UTF-8 by the script)
          python build/release_prep.py notes ${{ steps.ver.outputs.version }} --out release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no section for ${{ steps.ver.outputs.version }}" }

      - name: Publish GitHub Release
        if: steps.rel.outputs.needed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Magpie ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.ver.outputs.version, '-') }}
          files: |
            publish/Magpie.exe
            publish/Magpie.exe.sha256
            installer/Output/*.exe
            installer/Output/*.sha256
            release/Magpie-*.zip
            release/Magpie-*.zip.sha256

      # The test versions of a release are no longer needed once it is out.
      - name: Remove this version's test builds
        if: steps.rel.outputs.needed == 'true' && !contains(steps.ver.outputs.version, '-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' | Where-Object { $_ -like "v${{ steps.ver.outputs.version }}-beta.*" }
          foreach ($t in $tags) { gh release delete $t --repo "${{ github.repository }}" --cleanup-tag --yes; Write-Host "removed $t" }

      # ─── Test version for a PR that sets a new version (design E1) ───
      - name: Beta release notes
        if: steps.ver.outputs.beta == 'true'
        shell: pwsh
        run: |
          python build/release_prep.py notes ${{ steps.ver.outputs.base }} --out release-notes.md --header "**Test version** of Magpie ${{ steps.ver.outputs.base }}, built from PR #${{ github.event.pull_request.number }}. Installed copies get it only with Settings > Updates > Include test versions. Merging the PR publishes ${{ steps.ver.outputs.base }} to everyone."
          if ($LASTEXITCODE -ne 0) { throw "No CHANGELOG section for ${{ steps.ver.outputs.base }}" }

      - name: Publish test version
        if: steps.ver.outputs.beta == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: Magpie ${{ steps.ver.outputs.version }} (test)
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: |
            publish/Magpie.exe
            publish/Magpie.exe.sha256
            installer/Output/*.exe
            installer/Output/*.sha256
            release/Magpie-*.zip
            release/Magpie-*.zip.sha256

      - name: Keep only the newest test version
        if: steps.ver.outputs.beta == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -like "v${{ steps.ver.outputs.base }}-beta.*" -and $_ -ne "v${{ steps.ver.outputs.version }}" }
          foreach ($t in $tags) { gh release delete $t --repo "${{ github.repository }}" --cleanup-tag --yes; Write-Host "removed $t" }
