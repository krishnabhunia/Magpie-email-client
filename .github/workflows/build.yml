name: Build Magpie

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# One release job at a time, so a push to main and a tag push can't race to create the same release.
concurrency:
  group: magpie-build-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional Authenticode signing – skipped while these secrets are empty.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Magpie.sln

      - name: Unit tests (integration tests need a local IMAP server and are skipped here)
        run: dotnet test tests/Magpie.Core.Tests/Magpie.Core.Tests.csproj -c Release --no-restore --filter "Category!=Integration"

      - name: Build app
        run: dotnet build src/Magpie.App/Magpie.App.csproj -c Release --no-restore

      - name: XAML static checks (blocking)
        env:
          PYTHONUTF8: "1"
        shell: pwsh
        run: |
          dotnet run --project build/DpDump -c Release -- build/app-types.json src/Magpie.App/bin/Release/net8.0-windows/win-x64/Magpie.dll
          python build/xaml_check.py --dps build/app-types.json
          if ($LASTEXITCODE -ne 0) { throw "XAML check failed" }

      - name: Publish single-file EXE
        run: dotnet publish src/Magpie.App/Magpie.App.csproj -c Release -o publish

      - name: Sign Magpie.exe (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish\Magpie.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\publish" installer\Magpie.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash publish/Magpie.exe -Algorithm SHA256).Hash | Out-File publish/Magpie.exe.sha256 -Encoding ascii
          Get-ChildItem installer\Output\*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256" -Encoding ascii }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magpie-${{ steps.ver.outputs.version }}-${{ github.sha }}
          path: |
            publish/Magpie.exe
            publish/Magpie.exe.sha256
            installer/Output/*.exe
            installer/Output/*.sha256

      # Automatic releases: a push to main whose version (Directory.Build.props) has no release yet
      # publishes one — tag v<version>, EXE, installer and checksums, notes from CHANGELOG.md.
      # Magpie's built-in updater reads the newest release, so "push a new version" = "ship it".
      - name: Is this version released yet?
        id: rel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          # Released already *with* its files? (A release whose upload failed gets its files on the next push.)
          $assets = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and ($assets -contains 'Magpie.exe') -and ($assets -contains 'Magpie.exe.sha256')) {
            "needed=false" >> $env:GITHUB_OUTPUT; Write-Host "$tag already released"
          } else {
            "needed=true" >> $env:GITHUB_OUTPUT; Write-Host "$tag will be released (or its files completed)"
          }
          $global:LASTEXITCODE = 0
          # Release notes = this version's section of CHANGELOG.md
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## ${{ steps.ver.outputs.version }}( |$)" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $section = if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else { $section = @("Magpie ${{ steps.ver.outputs.version }}") }
          $section | Out-File release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        if: steps.rel.outputs.needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Magpie ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.ver.outputs.version, '-') }}
          files: |
            publish/Magpie.exe
            publish/Magpie.exe.sha256
            installer/Output/*.exe
            installer/Output/*.sha256
