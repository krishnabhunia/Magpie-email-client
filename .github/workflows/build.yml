name: Build Magpie

# Release assembly is independent of the platform pipelines. Each platform
# runs only in its own workflow; this workflow validates metadata, waits for
# successful artifacts at the same revision and publishes the combined release.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read   # the PR's changed files, for the version rule (design VB1)
  issues: write         # close the [Q..] issues a release ships
  actions: read         # read successful platform artifacts from independent workflow runs

env:
  PYTHONUTF8: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      base: ${{ steps.ver.outputs.base }}
      numeric: ${{ steps.ver.outputs.numeric }}
      released: ${{ steps.ver.outputs.released }}
      beta: ${{ steps.ver.outputs.beta }}
      artifact: ${{ steps.ver.outputs.artifact }}
      windows: ${{ steps.platforms.outputs.windows }}
      macos: ${{ steps.platforms.outputs.macos }}
      android: ${{ steps.platforms.outputs.android }}
    steps:
      - uses: actions/checkout@v7

      - name: Select independent platform runs
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: python common/scripts/ci_platforms.py

      - name: Reserve permanent beta tag before platform publishing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python common/scripts/ci_version.py reserve

      # Design E1: a PR that sets a new <Version> in Directory.Build.props is the release. While any PR from this
      # repository is open, its CI publishes a test version <version>-beta.<commit-time>.g<sha> (pre-release; tried through
      # Settings → Updates → "Include test versions" when the version is new, or downloaded from the release page
      # when the PR keeps the released version); merging a PR with a new version publishes <version> to everyone.
      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IS_OWN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $num = python common/scripts/release_prep.py numeric $v
          if ($LASTEXITCODE -ne 0) { throw "Version '$v' in Directory.Build.props isn't x.y.z" }
          # Released already *with* its files? (A release whose upload failed gets its files on the next push.)
          $assets = gh release view "v$v" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>$null
          # Every file the release step uploads must be there, so a release whose upload stopped half-way is finished
          # by the next run instead of being taken as complete.
          $expected = @()
          if ("${{ steps.platforms.outputs.windows }}" -eq "true") {
            $expected += @('Magpie.exe', "Magpie-Setup-$v.exe", "Magpie_$v.zip", 'Magpie.update.json')
          }
          if ("${{ steps.platforms.outputs.macos }}" -eq "true") { $expected += "Magpie_$v.dmg" }
          if ("${{ steps.platforms.outputs.android }}" -eq "true") { $expected += "Magpie_$v.apk" }
          $expected += @($expected | ForEach-Object { "$_.sha256" })
          $missing = @($expected | Where-Object { $assets -notcontains $_ })
          $released = ($LASTEXITCODE -eq 0) -and ($missing.Count -eq 0)
          if (($LASTEXITCODE -eq 0) -and $missing.Count -gt 0) { Write-Host "Release v$v is missing: $($missing -join ', ')" }
          $global:LASTEXITCODE = 0
          # Every PR from this repository gets a reproducible test version tied to its head commit — also a PR that changes
          # no version (docs, CI): then the test version carries the released number with a -beta suffix, which the
          # updater ranks below the release itself, so installed copies are never offered a downgrade.
          $beta = ($env:IS_OWN_PR -eq "true")
          $full = python common/scripts/ci_version.py
          if ($LASTEXITCODE -ne 0) { throw "Could not determine reproducible build version" }
          "version=$full" >> $env:GITHUB_OUTPUT
          "artifact=$(python common/scripts/release_prep.py artifact-name $full)" >> $env:GITHUB_OUTPUT
          "base=$v" >> $env:GITHUB_OUTPUT
          "numeric=$num" >> $env:GITHUB_OUTPUT
          "released=$($released.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "beta=$($beta.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $full · released: $released · test version: $beta"

      - name: Release script tests
        run: |
          python common/scripts/test_release_prep.py
          python common/scripts/test_update_manifest.py
          python -m unittest discover -s common/scripts -p 'test_ci_*.py'

      # Design VB1: every change to the program gets a new version number x.y.z, worked out from its CHANGELOG lines
      # (New -> x, Changed -> y, Fixed -> z). A PR that changes the app code, the installer or the build files but keeps
      # a version that is already released fails here. Docs, CI, scripts and tests alone need none.
      - name: A change to Magpie gets a new version
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'
          if ($LASTEXITCODE -ne 0) { throw "Couldn't list the files this PR changes" }
          $files | python common/scripts/release_prep.py needs-version --released ${{ steps.ver.outputs.released }}
          if ($LASTEXITCODE -ne 0) { throw "This PR changes Magpie without a new version (see the line above)" }

      # A new version must be ready to go out: CHANGELOG section dated, installer version matching.
      - name: New version is ready to release
        if: steps.ver.outputs.released != 'true'
        run: python common/scripts/release_prep.py check ${{ steps.ver.outputs.base }}

  package:
    needs: version
    # Do not hold a global beta-version lock while waiting up to 35 minutes
    # for independent platform builds. Serialize only publication to main.
    concurrency:
      group: magpie-package-${{ github.ref == 'refs/heads/main' && 'release' || github.run_id }}
      cancel-in-progress: false
    # A Mac-only or Android-only change gets its standalone artifact, without a Windows build.
    # No new combined release is needed for a change that did not build Windows.
    if: needs.version.result == 'success' && (needs.version.outputs.windows == 'true' || needs.version.outputs.macos == 'true' || needs.version.outputs.android == 'true')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BASE: ${{ needs.version.outputs.base }}
      ARTIFACT: ${{ needs.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7

      - name: Wait for matching successful platform runs
        id: wait
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_WINDOWS: ${{ needs.version.outputs.windows }}
          BUILD_MACOS: ${{ needs.version.outputs.macos }}
          BUILD_ANDROID: ${{ needs.version.outputs.android }}
        run: python common/scripts/ci_wait_artifacts.py

      - name: Download the Windows build
        if: needs.version.outputs.windows == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.wait.outputs.windows_run }}
          name: build-windows-${{ env.VERSION }}
          path: dl/windows

      - name: Download the macOS build
        if: needs.version.outputs.macos == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.wait.outputs.macos_run }}
          name: build-macos-${{ env.VERSION }}
          path: dl/macos

      - name: Download the Android build
        if: needs.version.outputs.android == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.wait.outputs.android_run }}
          name: build-android-${{ env.VERSION }}
          path: dl/android

      # Magpie_<v>.zip: portable/Magpie_<v>.exe, windows-x64/Magpie_<v>.exe (installer), macOS/Magpie_<v>.dmg,
      # Android/Magpie_<v>.apk — one file per folder (Krishna's workflow rule). The script refuses anything else.
      - name: Release zip
        if: needs.version.outputs.windows == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find dl -type f | sort
          # Found by name, so it doesn't matter how download-artifact laid the folders out.
          exe=$(find dl -type f -name Magpie.exe | head -1)
          setup=$(find dl -type f -name 'Magpie-Setup-*.exe' | head -1)
          [ -n "$exe" ] && [ -n "$setup" ] || { echo "::error::Windows build files missing"; exit 1; }
          args=(zip "$VERSION" --setup "$(dirname "$setup")" --exe "$(dirname "$exe")" --out release)
          dmg=$(find dl -type f -name '*.dmg' | head -1); [ -n "$dmg" ] && args+=(--dmg "$dmg")
          apk=$(find dl -type f -name '*.apk' | head -1); [ -n "$apk" ] && args+=(--apk "$apk")
          python common/scripts/release_prep.py "${args[@]}"
          mkdir -p dist
          (cd dist && unzip -q "../release/$ARTIFACT.zip")
          python common/scripts/release_prep.py check-folders dist
          find dist -type f | sort
          { echo "EXE_DIR=$(dirname "$exe")"; echo "SETUP_DIR=$(dirname "$setup")"; } >> "$GITHUB_ENV"

      # The single file in the run's Artifacts box: Magpie_<v> (GitHub hands it out as Magpie_<v>.zip).
      - name: Upload Magpie_${{ needs.version.outputs.version }}
        if: needs.version.outputs.windows == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.version.outputs.artifact }}
          path: dist/
          if-no-files-found: error

      # The release keeps the bare Magpie.exe (+ .sha256): every installed copy's updater downloads that file.
      - name: Release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files
          if [ "${{ needs.version.outputs.windows }}" = "true" ]; then
            cp "$EXE_DIR/Magpie.exe" "$EXE_DIR/Magpie.exe.sha256" files/
            cp "$SETUP_DIR"/Magpie-Setup-*.exe "$SETUP_DIR"/Magpie-Setup-*.exe.sha256 files/
            cp "release/$ARTIFACT.zip" "release/$ARTIFACT.zip.sha256" files/
          fi
          while IFS= read -r f; do
            cp "$f" files/
            sha256sum "$f" | cut -d' ' -f1 | tr a-f A-F > "files/$(basename "$f").sha256"
          done < <(find dl -type f \( -name '*.dmg' -o -name '*.apk' \))
          test -n "$(find files -type f -print -quit)" || { echo "::error::No platform files to release"; exit 1; }
          ls -la files

      # The manifest binds this exact release to its database/settings schemas and checked app files.
      # Only Windows portable/per-user transitions are supported; a packaged DMG does not imply Mac support.
      # Old releases without it remain visible but are not declared compatible merely because they have a checksum.
      - name: Publish checked version compatibility
        if: needs.version.outputs.windows == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=("$VERSION" --files files)
          python common/scripts/update_manifest.py generate "${args[@]}"
          python common/scripts/update_manifest.py check "${args[@]}"

      # Automatic releases: a push to main whose version (Directory.Build.props) has no release yet publishes one —
      # tag v<version>, only affected-platform assets, checksums, and notes from CHANGELOG.md.
      # The Windows version chooser reads retained releases; publishing never selects a version for that user.
      - name: Is this version released yet?
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if ("${{ needs.version.outputs.released }}" -eq "true") {
            "needed=false" >> $env:GITHUB_OUTPUT; Write-Host "v$env:VERSION already released"
          } else {
            "needed=true" >> $env:GITHUB_OUTPUT; Write-Host "v$env:VERSION will be released (or its files completed)"
          }
          # Release notes = this version's section of CHANGELOG.md (written as UTF-8 by the script)
          python common/scripts/release_prep.py notes $env:VERSION --out release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no section for $env:VERSION" }
          python common/scripts/release_notes_check.py release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Release notes must include actual implementations" }

      - name: Publish GitHub Release
        if: steps.rel.outputs.needed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Magpie ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.version.outputs.version, '-') }}
          files: files/*

      # Keep stable and beta releases with their installable assets. The version manager needs older builds
      # after a later beta or stable release appears; short-lived Actions artifacts are not rollback storage.

      # The [Q..] issues a release ships are listed in its CHANGELOG section (<!-- closes: #n … -->): closed here with
      # a link to the release, as GitHub's "Closes #n" in the PR doesn't close them in this repository. Never fails the release.
      - name: Close the issues this release ships
        if: steps.rel.outputs.needed == 'true' && !contains(needs.version.outputs.version, '-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION
          $ids = (python common/scripts/release_prep.py closes $v) -split ' ' | Where-Object { $_ }
          foreach ($n in $ids) {
            $state = gh issue view $n --repo "${{ github.repository }}" --json state --jq .state 2>$null
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::issue #$n not found"; $global:LASTEXITCODE = 0; continue }
            if ($state -eq "CLOSED") { Write-Host "#$n already closed"; continue }
            gh issue close $n --repo "${{ github.repository }}" --reason completed --comment "Shipped in Magpie ${v}: https://github.com/${{ github.repository }}/releases/tag/v${v}"
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::could not close #$n"; $global:LASTEXITCODE = 0 } else { Write-Host "closed #$n" }
          }
          exit 0

      # ─── Test version for a PR that sets a new version (design E1) ───
      - name: Beta release notes
        if: needs.version.outputs.beta == 'true'
        shell: pwsh
        run: |
          $header = if ("${{ needs.version.outputs.released }}" -eq "true") {
            "**Test version** built from PR #${{ github.event.pull_request.number }} on top of the released Magpie $($env:BASE) (the PR changes no program version). Download it from this page to try the PR; installed copies are not offered it, because $($env:BASE) itself is the newer version."
          } else {
            "**Test version** of Magpie $($env:BASE), built from PR #${{ github.event.pull_request.number }}. Installed copies get it only with Settings > Updates > Include test versions. Merging the PR publishes $($env:BASE) to everyone."
          }
          python common/scripts/release_prep.py notes $env:BASE --out release-notes.md --header $header
          if ($LASTEXITCODE -ne 0) { throw "No CHANGELOG section for $env:BASE" }
          python common/scripts/release_notes_check.py release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Beta release notes must include actual implementations" }

      - name: Publish test version
        if: needs.version.outputs.beta == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: Magpie ${{ needs.version.outputs.version }} (test)
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: files/*
