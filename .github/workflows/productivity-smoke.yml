name: Productivity Windows smoke
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/Magpie.App/**'
      - 'src/Magpie.Core/**'
      - 'build/ProductivitySmoke/**'
      - '.github/workflows/productivity-smoke.yml'
permissions:
  contents: read
jobs:
  productivity-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Isolated light and dark UI smoke
        run: dotnet run --project build/ProductivitySmoke/ProductivitySmoke.csproj -c Release -- smoke-captures
      - name: Upload native UI captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: productivity-native-ui-${{ github.sha }}
          path: smoke-captures/
          if-no-files-found: warn
