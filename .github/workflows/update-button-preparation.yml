name: Update button release preparation
on:
  pull_request:
    branches: [ main ]
    paths: [ '.github/workflows/update-button-preparation.yml' ]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Generate release metadata with repository script
        shell: pwsh
        run: |
          python build/release_prep.py apply --date 2026-10-09
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,pathlib; print('RELEASE_FILES_JSON='+json.dumps({p:pathlib.Path(p).read_text(encoding='utf-8') for p in ['CHANGELOG.md','Directory.Build.props','installer/Magpie.iss','CLAUDE.md']},ensure_ascii=True))"
