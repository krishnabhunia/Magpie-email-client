name: Windows Build

# Standalone Windows-only pipeline. macOS and Android never run here.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
      - 'common/**'
      - 'Directory.Build.props'
      - 'CHANGELOG.md'
      - 'Magpie.sln'
      - 'global.json'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - 'common/**'
      - 'Directory.Build.props'
      - 'CHANGELOG.md'
      - 'Magpie.sln'
      - 'global.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Optional Authenticode signing – skipped while these secrets are empty.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve shared build version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python common/scripts/ci_version.py
          if ($LASTEXITCODE -ne 0) { throw "Could not determine build version" }
          $num = python common/scripts/release_prep.py numeric $v
          if ($LASTEXITCODE -ne 0) { throw "Invalid numeric version" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "NUMERIC=$num" >> $env:GITHUB_ENV

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Magpie.sln

      # On failure the failing lines also become one error annotation (readable from the run page and the API).
      - name: Unit tests (integration tests need a local IMAP server and are skipped here)
        shell: pwsh
        run: |
          dotnet test common/tests/Magpie.Core.Tests/Magpie.Core.Tests.csproj -c Release --no-restore --filter "Category!=Integration" 2>&1 | Tee-Object -FilePath unit-tests.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Select-String -Path unit-tests.log -Pattern '\[FAIL\]|Failed |Assert\.|error |Expected|Actual' | Select-Object -First 60 | ForEach-Object { $_.Line.Trim() }
            Write-Output ("::error title=Unit tests failed::" + (($lines -join "`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
            exit 1
          }

      - name: Build app
        run: dotnet build windows/Magpie.App/Magpie.App.csproj -c Release --no-restore -p:Version=${{ env.VERSION }}

      - name: XAML static checks (blocking)
        shell: pwsh
        run: |
          dotnet run --project windows/build/DpDump -c Release -- windows/build/app-types.json windows/Magpie.App/bin/Release/net8.0-windows10.0.19041.0/win-x64/Magpie.dll
          python windows/build/xaml_check.py --dps windows/build/app-types.json
          if ($LASTEXITCODE -ne 0) { throw "XAML check failed" }

      - name: Every referenced assembly is in the build (blocking)
        id: assembly_refs
        shell: pwsh
        run: |
          dotnet run --project windows/build/DpDump -c Release -- --check-refs windows/Magpie.App/bin/Release/net8.0-windows10.0.19041.0/win-x64
          if ($LASTEXITCODE -ne 0) { throw "A referenced assembly is missing from the build: the app would crash on Windows" }

      # Native Windows light/dark UI smoke, contained in the Windows workflow.
      - name: Windows UI smoke (light and dark)
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        run: dotnet run --project windows/build/ProductivitySmoke/ProductivitySmoke.csproj -c Release -- smoke-captures

      # Only when the smoke fails (no Magpie zip is made then): the captures that show what broke.
      - name: UI smoke captures (failed runs only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-captures-${{ github.sha }}
          path: smoke-captures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish single-file EXE
        run: dotnet publish windows/Magpie.App/Magpie.App.csproj -c Release -o publish -p:Version=${{ env.VERSION }}

      # Different executable payloads exercise the production Windows handoff and recovery paths in temp profiles.
      - name: Windows version lifecycle smoke (native processes)
        if: ${{ !cancelled() && steps.assembly_refs.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          foreach ($fixture in @('original', 'selected')) {
            dotnet publish windows/build/VersionLifecycleSmoke/VersionLifecycleSmoke.csproj -c Release -o "version-lifecycle-smoke/$fixture" -p:Version=${{ env.VERSION }} "-p:LifecycleFixture=$fixture"
            if ($LASTEXITCODE -ne 0) { throw "Version lifecycle fixture '$fixture' failed to publish" }
          }
          $selected = (Resolve-Path 'version-lifecycle-smoke/selected/VersionLifecycleSmoke.exe').Path
          & .\version-lifecycle-smoke\original\VersionLifecycleSmoke.exe --selected-exe $selected
          if ($LASTEXITCODE -ne 0) { throw "Windows version lifecycle smoke failed" }

      - name: Sign Magpie.exe (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish\Magpie.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DMyAppVersion=${{ env.VERSION }}" "/DMyAppNumericVersion=${{ env.NUMERIC }}" "/DSourceDir=$PWD\publish" windows\installer\Magpie.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash publish/Magpie.exe -Algorithm SHA256).Hash | Out-File publish/Magpie.exe.sha256 -Encoding ascii
          Get-ChildItem windows\installer\Output\*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256" -Encoding ascii }

      # The release assembler reads this artifact from the successful Windows run.
      - name: Upload Windows build for release assembly
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-${{ env.VERSION }}
          path: |
            publish/Magpie.exe
            publish/Magpie.exe.sha256
            windows/installer/Output/*.exe
            windows/installer/Output/*.sha256
          if-no-files-found: error
          retention-days: 7
