name: Prepare startup fix validation
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'codex/fix-700-startup-style-20261009' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Generate patch metadata using release script
        shell: python
        run: |
          import sys, json, pathlib, datetime
          sys.path.insert(0, 'build')
          import release_prep
          if release_prep.pending():
              version = release_prep.apply(datetime.date(2026, 10, 9))
          else:
              version = release_prep.current()
          release_prep.check(version)
          for name in ['Directory.Build.props', 'installer/Magpie.iss', 'CHANGELOG.md', 'CLAUDE.md']:
              print('MAGPIE_RELEASE_FILE=' + json.dumps({'path': name, 'content': pathlib.Path(name).read_text(encoding='utf-8')}, ensure_ascii=True))
      - name: Core and release script tests
        shell: pwsh
        run: |
          python build/test_release_prep.py
          if ($LASTEXITCODE -ne 0) { throw "Release tests failed" }
          dotnet test tests/Magpie.Core.Tests/Magpie.Core.Tests.csproj -c Release --filter "Category!=Integration"
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed" }
      - name: Reproduce the original startup failure
        shell: pwsh
        run: |
          $file = "src/Magpie.App/MainWindow.xaml"
          $good = [IO.File]::ReadAllText($file)
          $bad = $good.Replace('<Button Style="{StaticResource Button.Secondary}" Content="Attachments"', '<Button Style="{StaticResource Button.Chip}" Content="Attachments"')
          if ($good -eq $bad) { throw "Regression fixture did not change the startup style" }
          try {
            [IO.File]::WriteAllText($file, $bad)
            dotnet run --project build/ProductivitySmoke/ProductivitySmoke.csproj -c Release -- failure-captures --expect-startup-style-failure
            if ($LASTEXITCODE -ne 0) { throw "Original failure was not reproduced" }
          } finally { [IO.File]::WriteAllText($file, $good) }
      - name: Validate fixed main window and productivity UI
        run: dotnet run --project build/ProductivitySmoke/ProductivitySmoke.csproj -c Release -- smoke-captures
